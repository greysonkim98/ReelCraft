name: Deploy frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - shared/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_AUTH_EMULATOR: ''
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
      NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_OPERATOR_NAME }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check required repository variables
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'NEXT_PUBLIC_API_URL',
            'NEXT_PUBLIC_FIREBASE_API_KEY',
            'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN',
            'NEXT_PUBLIC_FIREBASE_PROJECT_ID',
            'NEXT_PUBLIC_FIREBASE_APP_ID',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            throw new Error(`Missing GitHub repository variables: ${missing.join(', ')}`);
          }
          const api = new URL(process.env.NEXT_PUBLIC_API_URL);
          if (api.protocol !== 'https:' || api.hostname === 'localhost') {
            throw new Error('NEXT_PUBLIC_API_URL must use the deployed HTTPS API.');
          }
          NODE

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build shared package
        run: npm run build -w shared

      - name: Export static frontend
        run: npm run export -w frontend

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REELCRAFT }}
          projectId: reelcraft-4a7a7
          channelId: live
          firebaseToolsVersion: '15.35.0'
